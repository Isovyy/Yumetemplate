<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Couples Compatibility Card</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff9f5; min-height: 100vh; display: flex; justify-content: center; padding: 20px; font-family: Georgia, serif; }
#card { background: white; border-radius: 20px; border: 1.5px solid #f0e0d0; padding: 16px 14px 20px; width: 100%; max-width: 420px; height: fit-content; }
.ship-title { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 14px; color: #2a2a2a; letter-spacing: -0.3px; cursor: pointer; }
.ship-title .tap-hint { opacity: 0.4; font-weight: 400; font-size: 14px; display: block; }
.exporting .tap-hint { display: none !important; }
.circles-row { display: flex; justify-content: center; align-items: flex-end; gap: 24px; margin-bottom: 20px; }
.avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.circle-container { position: relative; width: 110px; height: 110px; cursor: pointer; }
.circle-canvas { position: absolute; top: 0; left: 0; width: 110px; height: 110px; border-radius: 50%; }
.circle-ring { position: absolute; top: 0; left: 0; width: 110px; height: 110px; border-radius: 50%; border: 3.5px solid #1a1a1a; pointer-events: none; z-index: 10; }
.upload-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; z-index: 5; pointer-events: none; }
.upload-hint i { font-size: 28px; color: #bbb; }
.circle-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 8; border-radius: 50%; }
.export-hide { transition: opacity 0.15s; }
.exporting .export-hide { visibility: hidden !important; height: 0 !important; overflow: hidden !important; margin: 0 !important; padding: 0 !important; min-height: 0 !important; }
.color-picker-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.color-picker-wrap label { font-size: 10px; color: #999; }
.color-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #ccc; cursor: pointer; position: relative; overflow: hidden; }
.color-dot input[type=color] { position: absolute; inset: -6px; opacity: 0; cursor: pointer; width: 150%; height: 150%; }
.meters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.meter-row { display: flex; align-items: center; gap: 6px; }
.meter-hint { text-align: center; font-size: 11px; color: #aaa; margin-bottom: 10px; font-family: sans-serif; }
.meter-hint button { background: none; border: 1px solid #ddd; border-radius: 6px; font-size: 11px; color: #888; cursor: pointer; padding: 2px 8px; font-family: sans-serif; }
.meter-hint button:hover { background: #f5f5f5; color: #333; }
.meter-label { font-size: 11px; font-weight: 600; color: #333; text-align: right; flex: 0 0 78px; line-height: 1.2; cursor: default; border-radius: 4px; padding: 1px 2px; }
.meter-label.editing-active { outline: 1.5px dashed #bbb; background: #fafafa; cursor: text; }
.meter-label input.label-input { width: 100%; font-size: 11px; font-weight: 600; color: #333; border: none; background: transparent; outline: none; font-family: Georgia, serif; text-align: right; padding: 0; }
.meter-label.right input.label-input { text-align: left; }
.meter-label.right { text-align: left; }
.meter-track { flex: 1; position: relative; height: 20px; display: flex; align-items: center; }
.meter-line { width: 100%; height: 2px; background: #ddd; border-radius: 2px; position: absolute; }
.heart-slider { position: absolute; width: 20px; height: 20px; cursor: grab; transform: translateX(-50%); top: 50%; margin-top: -10px; z-index: 5; user-select: none; touch-action: none; }
.heart-slider:active { cursor: grabbing; }
.heart-slider svg { width: 20px; height: 20px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.18)); }
.export-btn { display: block; width: 100%; padding: 11px; background: #2a2a2a; color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; letter-spacing: 0.3px; margin-top: 4px; }
.export-btn:active { opacity: 0.85; }
.char-name { font-size: 13px; font-weight: 700; color: #2a2a2a; text-align: center; margin-top: 6px; cursor: default; border-radius: 4px; padding: 1px 4px; min-width: 60px; }
.char-name.editing-active { outline: 1.5px dashed #bbb; background: #fafafa; cursor: text; }
.char-name input.name-input { width: 100%; font-size: 13px; font-weight: 700; color: #2a2a2a; border: none; background: transparent; outline: none; font-family: Georgia, serif; text-align: center; padding: 0; }
.export-only { display: none; }
.exporting .export-only { display: block !important; }
.zoom-controls { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.zoom-controls label { font-size: 9px; color: #aaa; }
.zoom-controls input[type=range] { width: 80px; }
</style>
</head>
<body>
<div id="card">
  <div class="ship-title" id="shipTitle"><span class="tap-hint">tap to edit</span>[Ship Name]</div>
  <div class="circles-row">
    <div class="avatar-wrap">
      <div class="circle-container" id="circleA">
        <canvas id="canvasA" width="440" height="440" class="circle-canvas"></canvas>
        <div class="upload-hint" id="hintA"><i class="ti ti-camera"></i></div>
        <div class="circle-ring"></div>
        <input type="file" accept="image/*" class="circle-input" id="fileA">
      </div>
      <div class="zoom-controls export-hide" id="zoomWrapA" style="display:none">
        <input type="range" min="1" max="4" step="0.01" value="1" id="zoomA">
        <label>zoom & drag to crop</label>
      </div>
      <div class="char-name" id="nameA" title="double-tap to edit">Person A</div>
      <div id="heartBadgeA" class="export-only" style="margin-top:2px"><svg id="heartSvgA" viewBox="0 0 24 24" width="28" height="28" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#a8c97f" stroke="#1a1a1a" stroke-width="1.5"/></svg></div>
      <div class="color-picker-wrap export-hide">
        <div class="color-dot" id="dotA" style="background:#a8c97f">
          <input type="color" id="colorA" value="#a8c97f">
        </div>
        <label>heart color</label>
      </div>
    </div>
    <div class="avatar-wrap">
      <div class="circle-container" id="circleB">
        <canvas id="canvasB" width="440" height="440" class="circle-canvas"></canvas>
        <div class="upload-hint" id="hintB"><i class="ti ti-camera"></i></div>
        <div class="circle-ring"></div>
        <input type="file" accept="image/*" class="circle-input" id="fileB">
      </div>
      <div class="zoom-controls export-hide" id="zoomWrapB" style="display:none">
        <input type="range" min="1" max="4" step="0.01" value="1" id="zoomB">
        <label>zoom & drag to crop</label>
      </div>
      <div class="char-name" id="nameB" title="double-tap to edit">Person B</div>
      <div id="heartBadgeB" class="export-only" style="margin-top:2px"><svg id="heartSvgB" viewBox="0 0 24 24" width="28" height="28" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#5bc4f5" stroke="#1a1a1a" stroke-width="1.5"/></svg></div>
      <div class="color-picker-wrap export-hide">
        <div class="color-dot" id="dotB" style="background:#5bc4f5">
          <input type="color" id="colorB" value="#5bc4f5">
        </div>
        <label>heart color</label>
      </div>
    </div>
  </div>
  <div class="meters" id="metersContainer"></div>
  <div class="meter-hint export-hide" id="editHint">double-tap any label to edit &nbsp;·&nbsp; <button id="resetBtn">reset labels</button></div>
  <button class="export-btn" id="exportBtn"><i class="ti ti-download" aria-hidden="true"></i> Export as PNG</button>
</div>

<script>
const CANVAS_SIZE = 440;

const DEFAULT_TRAITS = [
  ["Cooks","Orders takeout"],
  ["Messy Sleeper","Flat Sleeper"],
  ["Cleans","Procastinates"],
  ["Grocery list maker","Impulse snack buyer"],
  ["Skin care routine","All in one soap"],
  ["Keeps necessities Stocked",'"Oh, the soap got magically refilled"'],
  ["Makes breakfast","Misses breakfast"],
  ['"Can you fix this for me?"',"Fixes things"],
];

const traits = DEFAULT_TRAITS.map(p => [...p]);

let colorA = "#a8c97f", colorB = "#5bc4f5";
const positions = traits.map(() => ({ a: 0.35, b: 0.65 }));

function heartSVG(color, size=20) {
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="${color}" stroke="#1a1a1a" stroke-width="1.5"/></svg>`;
}

function makeLabelEditable(el, rowIndex, side) {
  // side: 0 = left, 1 = right
  let tapTimer = null;
  el.addEventListener('click', () => {
    if (tapTimer) {
      // double tap
      clearTimeout(tapTimer);
      tapTimer = null;
      enterEdit(el, rowIndex, side);
    } else {
      tapTimer = setTimeout(() => { tapTimer = null; }, 300);
    }
  });
  // also support dblclick on desktop
  el.addEventListener('dblclick', () => {
    enterEdit(el, rowIndex, side);
  });
}

function enterEdit(el, rowIndex, side) {
  if (el.classList.contains('editing-active')) return;
  el.classList.add('editing-active');
  const current = traits[rowIndex][side];
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'label-input';
  input.value = current;
  el.textContent = '';
  el.appendChild(input);
  input.focus();
  input.select();

  function save() {
    const val = input.value.trim() || DEFAULT_TRAITS[rowIndex][side];
    traits[rowIndex][side] = val;
    el.classList.remove('editing-active');
    el.textContent = val;
    makeLabelEditable(el, rowIndex, side);
  }
  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { input.blur(); }
    if (e.key === 'Escape') { input.value = traits[rowIndex][side]; input.blur(); }
  });
}

function buildMeters() {
  const container = document.getElementById('metersContainer');
  container.innerHTML = '';
  traits.forEach((pair, i) => {
    const row = document.createElement('div');
    row.className = 'meter-row';
    row.innerHTML = `
      <div class="meter-label" id="labelL${i}">${pair[0]}</div>
      <div class="meter-track" id="track${i}">
        <div class="meter-line"></div>
        <div class="heart-slider" id="hsA${i}" style="left:${positions[i].a*100}%">${heartSVG(colorA)}</div>
        <div class="heart-slider" id="hsB${i}" style="left:${positions[i].b*100}%">${heartSVG(colorB)}</div>
      </div>
      <div class="meter-label right" id="labelR${i}">${pair[1]}</div>`;
    container.appendChild(row);
  });
  traits.forEach((_, i) => {
    makeLabelEditable(document.getElementById(`labelL${i}`), i, 0);
    makeLabelEditable(document.getElementById(`labelR${i}`), i, 1);
    attachDrag(`hsA${i}`, `track${i}`, i, 'a');
    attachDrag(`hsB${i}`, `track${i}`, i, 'b');
  });
}

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Reset all labels to default?')) return;
  DEFAULT_TRAITS.forEach((pair, i) => {
    traits[i][0] = pair[0];
    traits[i][1] = pair[1];
  });
  buildMeters();
});

function makeNameEditable(el, defaultName) {
  let tapTimer = null;
  function activate() {
    if (el.classList.contains('editing-active')) return;
    el.classList.add('editing-active');
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'name-input';
    input.value = el.dataset.value || defaultName;
    el.textContent = '';
    el.appendChild(input);
    input.focus(); input.select();
    function save() {
      const val = input.value.trim() || defaultName;
      el.dataset.value = val;
      el.classList.remove('editing-active');
      el.textContent = val;
      makeNameEditable(el, defaultName);
    }
    input.addEventListener('blur', save);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { input.value = el.dataset.value || defaultName; input.blur(); }
    });
  }
  el.addEventListener('click', () => {
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; activate(); }
    else { tapTimer = setTimeout(() => { tapTimer = null; }, 300); }
  });
  el.addEventListener('dblclick', activate);
}

makeNameEditable(document.getElementById('nameA'), 'Person A');
makeNameEditable(document.getElementById('nameB'), 'Person B');

function attachDrag(sliderId, trackId, rowIndex, key) {
  const el = document.getElementById(sliderId);
  let active = false;
  function getPos(clientX) {
    const rect = document.getElementById(trackId).getBoundingClientRect();
    return Math.max(0.02, Math.min(0.98, (clientX - rect.left) / rect.width));
  }
  el.addEventListener('mousedown', e => {
    active = true;
    el.style.zIndex = 10;
    const otherId = sliderId.includes('hsA') ? sliderId.replace('hsA','hsB') : sliderId.replace('hsB','hsA');
    const other = document.getElementById(otherId);
    if (other) other.style.zIndex = 5;
    e.preventDefault();
  });
  el.addEventListener('touchstart', e => { active = true; e.preventDefault(); }, { passive: false });
  document.addEventListener('mousemove', e => {
    if (!active) return;
    positions[rowIndex][key] = getPos(e.clientX);
    el.style.left = (positions[rowIndex][key] * 100) + '%';
  });
  document.addEventListener('touchmove', e => {
    if (!active) return;
    positions[rowIndex][key] = getPos(e.touches[0].clientX);
    el.style.left = (positions[rowIndex][key] * 100) + '%';
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('mouseup', () => { active = false; });
  document.addEventListener('touchend', () => { active = false; });
}

function updateAllColors() {
  traits.forEach((_, i) => {
    const sA = document.getElementById(`hsA${i}`);
    const sB = document.getElementById(`hsB${i}`);
    if (sA) sA.innerHTML = heartSVG(colorA);
    if (sB) sB.innerHTML = heartSVG(colorB);
  });
}

document.getElementById('colorA').addEventListener('input', e => {
  colorA = e.target.value;
  document.getElementById('dotA').style.background = colorA;
  document.getElementById('heartSvgA').querySelector('path').setAttribute('fill', colorA);
  updateAllColors();
});
document.getElementById('colorB').addEventListener('input', e => {
  colorB = e.target.value;
  document.getElementById('dotB').style.background = colorB;
  document.getElementById('heartSvgB').querySelector('path').setAttribute('fill', colorB);
  updateAllColors();
});

const imageState = { A: null, B: null };
const dragState = { A: { on: false, lx: 0, ly: 0 }, B: { on: false, lx: 0, ly: 0 } };
const imgOff = { A: { x: 0, y: 0, zoom: 1 }, B: { x: 0, y: 0, zoom: 1 } };

function drawCircle(who) {
  const canvas = document.getElementById('canvas' + who);
  const ctx = canvas.getContext('2d');
  const S = CANVAS_SIZE, R = S / 2;
  ctx.clearRect(0, 0, S, S);
  ctx.save();
  ctx.beginPath();
  ctx.arc(R, R, R - 2, 0, Math.PI * 2);
  ctx.clip();
  const img = imageState[who];
  const s = imgOff[who];
  if (img) {
    const scale = Math.min(S / img.width, S / img.height) * s.zoom;
    const w = img.width * scale, h = img.height * scale;
    ctx.drawImage(img, (S - w) / 2 + s.x, (S - h) / 2 + s.y, w, h);
  } else {
    ctx.fillStyle = '#f0f0f0'; ctx.fillRect(0, 0, S, S);
    ctx.fillStyle = '#ddd';
    ctx.beginPath(); ctx.arc(R, R * 0.76, R * 0.33, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(R, R * 1.36, R * 0.51, R * 0.36, 0, 0, Math.PI); ctx.fill();
  }
  ctx.restore();
}

['A', 'B'].forEach(who => {
  drawCircle(who);

  document.getElementById('file' + who).addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const img = new Image();
    img.onload = () => {
      imageState[who] = img;
      imgOff[who] = { x: 0, y: 0, zoom: 1 };
      document.getElementById('zoomWrap' + who).style.display = 'flex';
      document.getElementById('hint' + who).style.display = 'none';
      drawCircle(who);
    };
    img.src = URL.createObjectURL(file);
  });

  document.getElementById('zoom' + who).addEventListener('input', e => {
    imgOff[who].zoom = parseFloat(e.target.value); drawCircle(who);
  });

  const circ = document.getElementById('circle' + who);
  const ds = dragState[who];
  const RATIO = CANVAS_SIZE / 110;

  circ.addEventListener('mousedown', e => { if (!imageState[who]) return; ds.on = true; ds.lx = e.clientX; ds.ly = e.clientY; e.preventDefault(); });
  circ.addEventListener('touchstart', e => { if (!imageState[who]) return; ds.on = true; ds.lx = e.touches[0].clientX; ds.ly = e.touches[0].clientY; }, { passive: true });

  document.addEventListener('mousemove', e => {
    if (!ds.on) return;
    imgOff[who].x += (e.clientX - ds.lx) * RATIO;
    imgOff[who].y += (e.clientY - ds.ly) * RATIO;
    ds.lx = e.clientX; ds.ly = e.clientY;
    drawCircle(who);
  });
  document.addEventListener('touchmove', e => {
    if (!ds.on) return;
    imgOff[who].x += (e.touches[0].clientX - ds.lx) * RATIO;
    imgOff[who].y += (e.touches[0].clientY - ds.ly) * RATIO;
    ds.lx = e.touches[0].clientX; ds.ly = e.touches[0].clientY;
    drawCircle(who);
  }, { passive: true });
  document.addEventListener('mouseup', () => { ds.on = false; });
  document.addEventListener('touchend', () => { ds.on = false; });
});

document.getElementById('exportBtn').addEventListener('click', async () => {
  const btn = document.getElementById('exportBtn');
  const card = document.getElementById('card');
  btn.textContent = 'Exporting…';
  btn.disabled = true;
  card.classList.add('exporting');
  btn.style.visibility = 'hidden';
  await new Promise(r => setTimeout(r, 80));
  try {
    const canvas = await html2canvas(card, {
      scale: 3,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#ffffff',
      logging: false,
      ignoreElements: el => el.classList.contains('export-hide') || el === btn
    });
    const dataUrl = canvas.toDataURL('image/png');
    const newTab = window.open();
    if (newTab) {
      newTab.document.write(`<html><body style="margin:0;background:#111;display:flex;flex-direction:column;align-items:center;padding:20px"><img src="${dataUrl}" style="max-width:100%;border-radius:12px"><br><a href="${dataUrl}" download="compatibility-card.png" style="color:white;font-family:sans-serif;font-size:16px;padding:12px 24px;background:#333;border-radius:8px;text-decoration:none;margin-top:12px">⬇ Download PNG</a><p style="color:#888;font-family:sans-serif;font-size:13px;margin-top:10px">On mobile: tap & hold the image → Save to Photos</p></body></html>`);
      newTab.document.close();
    } else {
      const link = document.createElement('a');
      link.download = 'compatibility-card.png';
      link.href = dataUrl;
      link.click();
    }
  } catch { alert('Export failed. Try again!'); }
  card.classList.remove('exporting');
  btn.style.visibility = '';
  btn.innerHTML = '<i class="ti ti-download" aria-hidden="true"></i> Export as PNG';
  btn.disabled = false;
});

document.getElementById('shipTitle').addEventListener('click', () => {
  const val = prompt('Enter ship name:');
  if (val !== null) {
    document.getElementById('shipTitle').innerHTML = `<span class="tap-hint">tap to edit</span>${val || '[Ship Name]'}`;
  }
});

buildMeters();
</script>
</body>
</html>
